.song[data-lyric-layout="pastel-duet"] [data-voice="seohee"]{--voice-rgb:var(--seohee-rgb)}
.song[data-lyric-layout="pastel-duet"] [data-voice="gilsang"]{--voice-rgb:var(--gilsang-rgb)}
.song[data-lyric-layout="pastel-duet"] .role-key{position:relative;display:inline-block;padding-bottom:3px}
.song[data-lyric-layout="pastel-duet"] .role-key::after{
 content:"";position:absolute;left:-2px;right:-2px;bottom:0;height:5px;
 border-radius:45% 38% 48% 32%;background:rgba(var(--voice-rgb),.88);
 transform:rotate(-1deg);pointer-events:none;
}
.song[data-lyric-layout="pastel-duet"] .role-key[data-voice="gilsang"]::after{transform:rotate(1deg)}
.song[data-lyric-layout="pastel-duet"] .lyrics .role,
.song[data-lyric-layout="pastel-duet"] .lane-role{
 position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
 clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
.song[data-lyric-layout="pastel-duet"] .lyrics{max-width:700px;margin-inline:auto;line-height:1.85;padding-bottom:28px}
.song[data-lyric-layout="pastel-duet"] .stanza{margin-bottom:22px}
.song[data-lyric-layout="pastel-duet"] .stanza:last-child{margin-bottom:0}
.song[data-lyric-layout="pastel-duet"] .voice-cloud{
 position:relative;isolation:isolate;display:flow-root;width:100%;min-width:0;
 padding:10px 18px;text-align:left;break-inside:avoid;
}
.song[data-lyric-layout="pastel-duet"] .voice-cloud + .voice-cloud{margin-top:4px}
.song[data-lyric-layout="pastel-duet"] .voice-cloud[data-voice="gilsang"]{text-align:right}
.song[data-lyric-layout="pastel-duet"] .voice-cloud[data-voice="both"]{text-align:center;padding-block:14px}
.song[data-lyric-layout="pastel-duet"] .lyric-line{position:relative;z-index:1;display:block;padding:3px 0}
.song[data-lyric-layout="pastel-duet"] .lyric-text{display:block}
.song[data-lyric-layout="pastel-duet"] .voice-cloud::before,
.song[data-lyric-layout="pastel-duet"] .duet-wash::before{
 content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
 background-image:var(--duet-texture);background-repeat:no-repeat;background-size:200% 150%;
 background-position:left center;opacity:var(--wash-opacity);
 -webkit-mask-image:radial-gradient(ellipse 70% 56% at 40% 50%,#000 35%,#0008 61%,transparent 85%);
 mask-image:radial-gradient(ellipse 70% 56% at 40% 50%,#000 35%,#0008 61%,transparent 85%);
}
.song[data-lyric-layout="pastel-duet"] .voice-cloud::before{inset:-8px 0}
.song[data-lyric-layout="pastel-duet"] .voice-cloud[data-voice="seohee"]::before{right:auto;width:var(--solo-wash-width)}
.song[data-lyric-layout="pastel-duet"] .voice-cloud[data-voice="gilsang"]::before{left:auto;width:var(--solo-wash-width)}
.song[data-lyric-layout="pastel-duet"] [data-voice="gilsang"]::before{
 background-position:right center;
 -webkit-mask-image:radial-gradient(ellipse 70% 56% at 60% 50%,#000 35%,#0008 61%,transparent 85%);
 mask-image:radial-gradient(ellipse 70% 56% at 60% 50%,#000 35%,#0008 61%,transparent 85%);
}
.song[data-lyric-layout="pastel-duet"] .voice-cloud[data-voice="both"]::before{
 background-size:100% 150%;background-position:center;
 -webkit-mask-image:radial-gradient(ellipse 75% 56% at 50% 50%,#000 36%,#0009 60%,transparent 87%);
 mask-image:radial-gradient(ellipse 75% 56% at 50% 50%,#000 36%,#0009 60%,transparent 87%);
}
.song[data-lyric-layout="pastel-duet"] .overlap{
 position:relative;isolation:isolate;border:0;padding:8px 0;margin:0;
 column-gap:clamp(20px,3vw,36px);row-gap:0;
}
.song[data-lyric-layout="pastel-duet"] .duet-wash{position:relative;z-index:0;min-width:0;overflow:hidden;pointer-events:none}
.song[data-lyric-layout="pastel-duet"] .lane-line{position:relative;z-index:1;min-width:0;border:0;padding:6px 18px;font-size:inherit}
.song[data-lyric-layout="pastel-duet"] .lane-line[data-lane="0"]{text-align:left}
.song[data-lyric-layout="pastel-duet"] .lane-line[data-lane="1"]{text-align:right}
.night .song[data-lyric-layout="pastel-duet"]{--wash-opacity:.22}
@media(max-width:1100px){
 #reader-view[data-layout="pastel-duet"] .reader-layout{display:block;max-width:824px;padding:24px clamp(16px,4vw,36px) 56px}
 #reader-view[data-layout="pastel-duet"] .sidebar{display:none}
}
@media(max-width:680px){
 .song[data-lyric-layout="pastel-duet"]{--solo-wash-width:84%}
 .song[data-lyric-layout="pastel-duet"] .scene-note{margin-bottom:26px}
 .song[data-lyric-layout="pastel-duet"] .voice-cloud{padding:8px 10px}
 .song[data-lyric-layout="pastel-duet"] .voice-cloud[data-voice="both"]{padding-block:12px}

<body><main class="lock-page"><section class="lock-card"><p class="eyebrow">공연 가사집</p><h1>서희,<br>새벽빛</h1><p id="lock-status" role="status">공연 QR 또는 전달받은 링크로 접속해 주세요.</p><noscript><small>가사집을 열려면 브라우저의 JavaScript를 켜 주세요.</small></noscript></section></main><script>/* QR Model 2: version 6, error correction L, byte mode, mask 0.
   136 data codewords in two 68-byte blocks, 18 parity codewords per block. */
function makeQrMatrix(value) {
  const bytes = new TextEncoder().encode(value);
  if (bytes.length > 134) throw new Error('주소는 134바이트 이내로 입력해 주세요.');
  const bits = [];
  function put(n, count) { for (let i = count - 1; i >= 0; i--) bits.push((n >>> i) & 1); }
  put(4, 4); put(bytes.length, 8); bytes.forEach(b => put(b, 8));
  for (let i = 0, limit = Math.min(4, 1088 - bits.length); i < limit; i++) bits.push(0);
  while (bits.length % 8) bits.push(0);
  const data = [];
  for (let i = 0; i < bits.length; i += 8) data.push(bits.slice(i, i + 8).reduce((a, b) => (a << 1) | b, 0));
  for (let i = 0; data.length < 136; i++) data.push(i % 2 ? 17 : 236);
  const exp = new Array(512), log = new Array(256).fill(0);
  for (let i = 0, x = 1; i < 255; i++) { exp[i] = x; log[x] = i; x <<= 1; if (x & 256) x ^= 285; }
  for (let i = 255; i < 512; i++) exp[i] = exp[i - 255];
  const mul = (a, b) => !a || !b ? 0 : exp[log[a] + log[b]];
  let gen = [1];
  for (let i = 0; i < 18; i++) {
    const next = new Array(gen.length + 1).fill(0);
    gen.forEach((c, j) => { next[j] ^= c; next[j + 1] ^= mul(c, exp[i]); }); gen = next;
  }
  function parity(block) {
    const msg = [...block, ...new Array(18).fill(0)];
    for (let i = 0; i < block.length; i++) {
      const factor = msg[i]; if (factor) for (let j = 0; j < gen.length; j++) msg[i + j] ^= mul(gen[j], factor);
    } return msg.slice(-18);
  }
  const blocks = [data.slice(0, 68), data.slice(68)], checks = blocks.map(parity), codewords = [];
  for (let i = 0; i < 68; i++) for (let b = 0; b < 2; b++) codewords.push(blocks[b][i]);
  for (let i = 0; i < 18; i++) for (let b = 0; b < 2; b++) codewords.push(checks[b][i]);
  const size = 41, m = Array.from({length:size}, () => new Array(size).fill(null));
  function finder(row, col) {
    for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++) {
      if (row + r < 0 || col + c < 0 || row + r >= size || col + c >= size) continue;
      m[row+r][col+c] = (r >= 0 && r <= 6 && (c === 0 || c === 6)) || (c >= 0 && c <= 6 && (r === 0 || r === 6)) || (r >= 2 && r <= 4 && c >= 2 && c <= 4);
    }
  }
  finder(0,0); finder(size-7,0); finder(0,size-7);
  for (const row of [6,34]) for (const col of [6,34]) {
    if (m[row][col] !== null) continue;
    for (let r=-2;r<=2;r++) for(let c=-2;c<=2;c++) m[row+r][col+c]=Math.abs(r)===2||Math.abs(c)===2||(r===0&&c===0);
  }
  for (let i=8;i<size-8;i++) { if(m[i][6]===null)m[i][6]=i%2===0; if(m[6][i]===null)m[6][i]=i%2===0; }
  let format = 8 << 10;
  const bitLength = n => n ? 32-Math.clz32(n) : 0;
  while(bitLength(format)>=bitLength(0x537)) format ^= 0x537 << (bitLength(format)-bitLength(0x537));
  format = ((8<<10)|format)^0x5412;
  for(let i=0;i<15;i++) {
    const dark=!!((format>>>i)&1);
    if(i<6)m[i][8]=dark; else if(i<8)m[i+1][8]=dark; else m[size-15+i][8]=dark;
    if(i<8)m[8][size-i-1]=dark; else if(i<9)m[8][15-i]=dark; else m[8][15-i-1]=dark;
  }

  let row=size-1, direction=-1, bit=7, word=0;
  for(let col=size-1;col>0;col-=2) {
    if(col===6)col--;
    for(;;) {
      for(let c=0;c<2;c++) if(m[row][col-c]===null) {
        let dark=word<codewords.length?!!((codewords[word]>>>bit)&1):false;
        if((row+col-c)%2===0)dark=!dark; m[row][col-c]=dark;

    }

function qrSvg(url) {
  const m=makeQrMatrix(url),n=m.length+8;
  let path='';m.forEach((row,y)=>row.forEach((v,x)=>{if(v)path+=`M${x+4},${y+4}h1v1h-1z`;}));

}

function initSongbook(accessKey){
  'use strict';
  const $=id=>document.getElementById(id), songs=[...document.querySelectorAll('.song')];
  const readSaved=(key,fallback)=>{try{return localStorage.getItem(key)||fallback;}catch{return fallback;}};
  const save=(key,value)=>{try{localStorage.setItem(key,value);}catch{}};
  function setNight(n){document.body.classList.toggle('night',n);$('theme-toggle').setAttribute('aria-pressed',String(n));$('theme-toggle').setAttribute('aria-label','화면 전환');$('theme-toggle').textContent='화면 전환';save('seohee-night',n?'1':'0');}
  setNight(readSaved('seohee-night','0')==='1');
  $('theme-toggle').addEventListener('click',()=>setNight(!document.body.classList.contains('night')));
  let previous='';
  function route(){
    const params=new URLSearchParams(location.hash.slice(1));
    if(params.get('access')!==accessKey){location.reload();return;}
    const hash=params.get('view')||'home',active=songs.find(s=>s.id===hash),isSong=!!active;
    const isIntent=hash==='intent';
    $('home-view').hidden=isSong||isIntent;$('reader-view').hidden=!isSong;$('intent-view').hidden=!isIntent;
    const layout=active?.getAttribute('data-lyric-layout');
    if(layout)$('reader-view').setAttribute('data-layout',layout);else $('reader-view').removeAttribute('data-layout');
    songs.forEach(s=>s.hidden=s!==active);
    document.querySelectorAll('[data-song-link]').forEach(a=>{if(a.dataset.songLink===hash)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
    document.querySelectorAll('[data-main-view]').forEach(a=>{if(a.dataset.mainView===hash)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
    if(isSong){
      document.title=active.querySelector('.song-name').textContent+' — 서희, 새벽빛';
      if(previous!==hash){window.scrollTo({top:0,behavior:'instant'});active.querySelector('h1').focus({preventScroll:true});}
      save('seohee-last-song',hash);
    }else if(isIntent){
      document.title='기획의도 — 서희, 새벽빛';
      if(previous!==hash){window.scrollTo({top:0,behavior:'instant'});$('intent-title').focus({preventScroll:true});}
    }else{
      document.title='서희, 새벽빛 — 공연 가사집';
      if(hash==='contents')requestAnimationFrame(()=>$('contents').scrollIntoView({behavior:'instant',block:'start'}));
      else window.scrollTo({top:0,behavior:'instant'});
    }
    previous=hash;
  }
  document.querySelectorAll('a[href^="#"]').forEach(a=>{
    const target=a.getAttribute('href').slice(1);
    if(target==='main'){a.addEventListener('click',e=>{e.preventDefault();$('main').tabIndex=-1;$('main').focus();$('main').scrollIntoView();});return;}
    a.setAttribute('href','#'+new URLSearchParams({access:accessKey,view:target}));
  });
  window.addEventListener('hashchange',route);route();
  const dialog=$('share-dialog');
  let shareUrl='';
  function normalizeUrl(value){const u=new URL(value);if(!['http:','https:'].includes(u.protocol)||!u.hostname||u.username||u.password)throw new Error('가사집 링크를 확인해 주세요.');return u.href;}
  function showQR(value){
    try{const qrUrl=normalizeUrl(value.trim());$('qr-image').innerHTML=qrSvg(qrUrl);$('qr-result').hidden=false;$('share-status').textContent='이 QR 또는 링크를 받은 사람만 열람할 수 있어요.';}
    catch(e){$('qr-result').hidden=true;$('share-status').textContent=e.message;}
  }
  $('share-open').addEventListener('click',()=>{
    let current='';if(['http:','https:'].includes(location.protocol)&&!['localhost','127.0.0.1'].includes(location.hostname)){const u=new URL(location.href);u.hash=new URLSearchParams({access:accessKey}).toString();u.search='';current=u.href;}
    shareUrl=current;
    if(current)$('share-link').setAttribute('href',current);else $('share-link').removeAttribute('href');
    $('copy-url').disabled=!current;$('share-copy-status').hidden=true;$('share-copy-status').textContent='';
    $('qr-result').hidden=true;$('share-status').textContent=current?'':'가사집 링크로 접속하면 QR을 확인할 수 있어요.';
    if(current)showQR(current);
    if(dialog.showModal)dialog.showModal();else dialog.setAttribute('open','');
  });
  function closeShare(){if(dialog.close)dialog.close();else dialog.removeAttribute('open');$('share-open').focus();}
  $('share-close').addEventListener('click',closeShare);
  $('share-link').addEventListener('click',closeShare);
  dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeShare();}});
  function fallbackCopy(value){
    const field=document.createElement('textarea');
    field.value=value;field.setAttribute('readonly','');field.setAttribute('aria-label','복사할 가사집 주소');
    field.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none';
    dialog.appendChild(field);
    try{field.focus();field.select();field.setSelectionRange(0,value.length);return document.execCommand('copy');}
    catch{return false;}
    finally{field.remove();}
  }
  $('copy-url').addEventListener('click',async()=>{
    if(!shareUrl)return;
    const button=$('copy-url');button.disabled=true;
    let copied=false;
    try{
      if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(shareUrl);copied=true;}
    }catch{}
    if(!copied)copied=fallbackCopy(shareUrl);
    $('share-copy-status').textContent=copied?'주소를 복사했어요.':'복사하지 못했어요. 가사집 링크를 길게 누르거나 마우스 오른쪽 버튼으로 눌러 링크 주소를 복사해 주세요.';
    $('share-copy-status').hidden=false;button.disabled=false;button.focus();
  });
}

function decode64(value){return Uint8Array.from(atob(value),c=>c.charCodeAt(0));}
async function unlockSongbook(){
  const status=document.getElementById('lock-status');
  const params=new URLSearchParams(location.hash.slice(1));
  const access=params.get('access');
  if(!access||!/^[A-Za-z0-9_-]{43}$/.test(access)){status.textContent='공연 QR을 스캔하거나, 전달받은 가사집 링크로 접속해 주세요.';return;}
  if(!globalThis.crypto?.subtle){status.textContent='이 브라우저에서는 가사집을 열 수 없어요. 최신 Chrome 또는 Safari에서 링크를 열어 주세요.';return;}
  status.textContent='가사집을 여는 중입니다.';
  try{
    const raw=decode64(access.replace(/-/g,'+').replace(/_/g,'/')+'=');
    const key=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode64(songbookEnvelope.iv),additionalData:new TextEncoder().encode('seohee-songbook:v1'),tagLength:128},key,decode64(songbookEnvelope.ciphertext));
    const markup=new TextDecoder('utf-8',{fatal:true}).decode(plain);
    document.body.innerHTML=markup;
    window.removeEventListener('hashchange',unlockSongbook);
    initSongbook(access);
  }catch{
    const note=document.getElementById('lock-status');
    if(note)note.textContent='이 링크로 가사집을 열 수 없어요. 전달받은 링크 전체를 다시 확인해 주세요.';
  }
}
window.addEventListener('hashchange',unlockSongbook);
unlockSongbook();
