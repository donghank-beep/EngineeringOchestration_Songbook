<body><main class="lock-page"><section class="lock-card"><p class="eyebrow">공연 가사집</p><h1>서희,<br>새벽빛</h1><p id="lock-status" role="status">공연 QR 또는 전달받은 링크로 접속해 주세요.</p><noscript><small>가사집을 열려면 브라우저의 JavaScript를 켜 주세요.</small></noscript></section></main><script>/* QR Model 2: version 6, error correction L, byte mode, mask 0.
   136 data codewords in two 68-byte blocks, 18 parity codewords per block. */
function makeQrMatrix(value) {
  const bytes = new TextEncoder().encode(value);
  if (bytes.length > 134) throw new Error('주소는 134바이트 이내로 입력해 주세요.');
  const bits = [];
  function put(n, count) { for (let i = count - 1; i >= 0; i--) bits.push((n >>> i) & 1); }
  put(4, 4); put(bytes.length, 8); bytes.forEach(b => put(b, 8));
  for (let i = 0, limit = Math.min(4, 1088 - bits.length); i < limit; i++) bits.push(0);
  while (bits.length % 8) bits.push(0);
  const data = [];
  for (let i = 0; i < bits.length; i += 8) data.push(bits.slice(i, i + 8).reduce((a, b) => (a << 1) | b, 0));
  for (let i = 0; data.length < 136; i++) data.push(i % 2 ? 17 : 236);
  const exp = new Array(512), log = new Array(256).fill(0);

function initSongbook(accessKey){
  'use strict';
  const $=id=>document.getElementById(id), songs=[...document.querySelectorAll('.song')];
  const readSaved=(key,fallback)=>{try{return localStorage.getItem(key)||fallback;}catch{return fallback;}};
  const save=(key,value)=>{try{localStorage.setItem(key,value);}catch{}};
  let fontSize=Math.min(25,Math.max(15,Number(readSaved('seohee-font','19'))||19));
  function applyFont(){document.documentElement.style.setProperty('--lyric-size',fontSize+'px');$('font-down').disabled=fontSize<=15;$('font-up').disabled=fontSize>=25;save('seohee-font',fontSize);}
  applyFont();
  $('font-down').addEventListener('click',()=>{fontSize=Math.max(15,fontSize-2);applyFont();});
  $('font-up').addEventListener('click',()=>{fontSize=Math.min(25,fontSize+2);applyFont();});
  function setNight(n){document.body.classList.toggle('night',n);$('theme-toggle').setAttribute('aria-pressed',String(n));$('theme-toggle').textContent=n?'낮 화면':'밤 화면';save('seohee-night',n?'1':'0');}
  setNight(readSaved('seohee-night','0')==='1');
  $('theme-toggle').addEventListener('click',()=>setNight(!document.body.classList.contains('night')));
  let previous='';
  function route(){
    const params=new URLSearchParams(location.hash.slice(1));
    if(params.get('access')!==accessKey){location.reload();return;}
    const hash=params.get('view')||'home',active=songs.find(s=>s.id===hash),isSong=!!active;
    $('home-view').hidden=isSong;$('reader-view').hidden=!isSong;
    songs.forEach(s=>s.hidden=s!==active);
    document.querySelectorAll('[data-song-link]').forEach(a=>{if(a.dataset.songLink===hash)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
    if(isSong){
      document.title=active.querySelector('.song-name').textContent+' — 서희, 새벽빛';
      if(previous!==hash){window.scrollTo({top:0,behavior:'instant'});active.querySelector('h1').focus({preventScroll:true});}
      save('seohee-last-song',hash);
    }else{
      document.title='서희, 새벽빛 — 공연 가사집';
      if(hash==='contents')requestAnimationFrame(()=>$('contents').scrollIntoView({behavior:'instant',block:'start'}));
      else window.scrollTo({top:0,behavior:'instant'});
    }
    previous=hash;
  }
  document.querySelectorAll('a[href^="#"]').forEach(a=>{
    const target=a.getAttribute('href').slice(1);
    if(target==='main'){a.addEventListener('click',e=>{e.preventDefault();$('main').tabIndex=-1;$('main').focus();$('main').scrollIntoView();});return;}
    a.setAttribute('href','#'+new URLSearchParams({access:accessKey,view:target}));
  });
  window.addEventListener('hashchange',route);route();
  const dialog=$('share-dialog');
  function normalizeUrl(value){const u=new URL(value);if(!['http:','https:'].includes(u.protocol)||!u.hostname||u.username||u.password)throw new Error('가사집 링크를 확인해 주세요.');return u.href;}
  function showQR(value){
    try{const qrUrl=normalizeUrl(value.trim());$('qr-image').innerHTML=qrSvg(qrUrl);$('qr-result').hidden=false;$('share-status').textContent='이 QR 또는 링크를 받은 사람만 열람할 수 있어요.';}
    catch(e){$('qr-result').hidden=true;$('share-status').textContent=e.message;}
  }
  $('share-open').addEventListener('click',()=>{
    let current='';if(['http:','https:'].includes(location.protocol)&&!['localhost','127.0.0.1'].includes(location.hostname)){const u=new URL(location.href);u.hash=new URLSearchParams({access:accessKey}).toString();u.search='';current=u.href;}
    $('share-url').value=current;$('qr-result').hidden=true;$('share-status').textContent=current?'':'가사집 링크로 접속하면 QR을 확인할 수 있어요.';
    if(current)showQR(current);
    if(dialog.showModal)dialog.showModal();else dialog.setAttribute('open','');
  });
  function closeShare(){if(dialog.close)dialog.close();else dialog.removeAttribute('open');$('share-open').focus();}
  $('share-close').addEventListener('click',closeShare);
  dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeShare();}});
  $('share-form').addEventListener('submit',e=>{e.preventDefault();showQR($('share-url').value);});
}

function decode64(value){return Uint8Array.from(atob(value),c=>c.charCodeAt(0));}
async function unlockSongbook(){
  const status=document.getElementById('lock-status');
  const params=new URLSearchParams(location.hash.slice(1));
  const access=params.get('access');
  if(!access||!/^[A-Za-z0-9_-]{43}$/.test(access)){status.textContent='공연 QR을 스캔하거나, 전달받은 가사집 링크로 접속해 주세요.';return;}
  if(!globalThis.crypto?.subtle){status.textContent='이 브라우저에서는 가사집을 열 수 없어요. 최신 Chrome 또는 Safari에서 링크를 열어 주세요.';return;}
  status.textContent='가사집을 여는 중입니다.';
  try{
    const raw=decode64(access.replace(/-/g,'+').replace(/_/g,'/')+'=');
    const key=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode64(songbookEnvelope.iv),additionalData:new TextEncoder().encode('seohee-songbook:v1'),tagLength:128},key,decode64(songbookEnvelope.ciphertext));
    const markup=new TextDecoder('utf-8',{fatal:true}).decode(plain);
    document.body.innerHTML=markup;
    window.removeEventListener('hashchange',unlockSongbook);
    initSongbook(access);
  }catch{
    const note=document.getElementById('lock-status');
    if(note)note.textContent='이 링크로 가사집을 열 수 없어요. 전달받은 링크 전체를 다시 확인해 주세요.';
  }
}
window.addEventListener('hashchange',unlockSongbook);
unlockSongbook();
